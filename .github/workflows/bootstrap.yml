name: Oracle Runner Bootstrap

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: "Agent name shown in Oracle controller"
        required: false
        default: "runner-gh"
      oracle_url:
        description: "Oracle Agent Server URL"
        required: false
        default: "https://oracle-agent.femboy.us.ci"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # keep-alive sleep 99999 (~27.7h); private repo allows up to 50000 min.
    # If the run is rejected, raise repo limit: Settings -> Actions -> General -> Job timeout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show IP info
        run: |
          curl ifconfig.io
          echo "runner:runner" | sudo chpasswd
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          sudo systemctl enable --now ssh
          sudo systemctl status ssh --no-pager | head -5

      - name: Cloudflared debug tunnel (SSH backdoor)
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # Runner 出站加入 Cloudflare 隧道：bootstrap.femboy.us.ci -> runner:22（Agent 挂了还能 SSH 进去排查）
          # 固定到 VPS 同款已知可用版本 2026.9.1，避免 latest 回归；下载失败回退 latest
          curl -sfL https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64 -o /tmp/cloudflared             || curl -sfL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo chmod +x /tmp/cloudflared
          /tmp/cloudflared --version
          # service install 内部会执行 systemctl start cloudflared（Cloudflare 官方实现）
          # 临时 VM 首次启动偶发超时：失败后 reset-failed 再补两次显式 start
          sudo /tmp/cloudflared service install "$CF_TUNNEL_TOKEN" || true
          sudo systemctl reset-failed cloudflared 2>/dev/null || true
          sudo systemctl start cloudflared || true
          sleep 3
          sudo systemctl start cloudflared || true
          sleep 3
          echo "=== cloudflared active? ==="
          systemctl is-active cloudflared || { echo "cloudflared NOT active; journal:"; journalctl -u cloudflared --no-pager -n 25 || true; exit 1; }

      - name: Configure MCP (shell-mcp)
        run: |
          python3 -m venv /home/runner/mcp-venv
          /home/runner/mcp-venv/bin/python -m pip install "mcp==2.2.0" uvicorn starlette
          # MCP 代码 vendor 在本仓库 mcp/，不依赖外部下载
          sudo cp mcp/shell_mcp.py /home/runner/shell_mcp.py
          sudo cp mcp/shell-mcp.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable shell-mcp
          sudo systemctl start shell-mcp
          sudo systemctl status shell-mcp --no-pager | head -8

      - name: Install Oracle Agent
        env:
          ORACLE_URL: ${{ inputs.oracle_url }}
          AGENT_NAME: ${{ inputs.agent_name }}
        run: |
          sudo bash agent/install.sh
          sleep 5
          systemctl status oracle-agent --no-pager | head -8
          python3 -c "import json; print('agent_id:', json.load(open('/opt/oracle-agent/state.json'))['agent_id'])" 2>/dev/null \
            || echo "(agent not registered yet — check journalctl -u oracle-agent)"
      - name: Keep alive (Oracle decides when to end)
        run: sleep 99999
